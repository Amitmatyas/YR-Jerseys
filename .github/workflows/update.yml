name: HFD Tracking Update

on:
  workflow_dispatch: # הרצה ידנית
  schedule:
    - cron: '0 * * * *' # כל שעה עגולה

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Chrome and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          pip install selenium webdriver-manager

      - name: Run Scraper
        run: |
          # נכנס לתיקייה שבה נמצא הסקריפט
          cd tracking-folder
          python scraper.py

      - name: Commit and Push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # מוסיף את קובץ הנתונים שנוצר בתוך התיקייה
          git add tracking-folder/tracking_data.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update HFD tracking [skip ci]"
            git push
          fi

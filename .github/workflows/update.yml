name: Manual Update Tracking

on:
  workflow_dispatch: # הפעלה ידנית מהלשונית Actions
  schedule:
    - cron: '0 * * * *' # הרצה אוטומטית בכל שעה עגולה

# נותן הרשאות כתיבה ל-Action כדי שיוכל לעדכן את ה-JSON
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Chrome and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          pip install selenium webdriver-manager

      - name: Run Scraper
        run: |
          # נכנס לתיקייה ומריץ את הסקריפט
          # וודא ששם התיקייה כאן תואם לשם התיקייה שיצרת ב-GitHub
          cd tracking-folder
          python scraper.py

      - name: Commit and Push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # בודק אם נוצר או עודכן קובץ הנתונים
          git add tracking-folder/tracking_data.json
          
          # מבצע קומיט רק אם יש שינוי אמיתי בתוכן
          if git diff --staged --quiet; then
            echo "No changes in tracking data, nothing to commit."
          else
            git commit -m "Update tracking data [skip ci]"
            git push
          fi

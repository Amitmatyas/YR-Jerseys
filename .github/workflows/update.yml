name: HFD API Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Requests
        run: pip install requests

      - name: Run API Scraper
        env:
          AFTERSHIP_KEY: ${{ secrets.AFTERSHIP_KEY }} # כאן הקסם קורה
        run: |
          cd tracking-folder
          python scraper.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add tracking-folder/tracking_data.json
          git commit -m "Update via API [skip ci]" || echo "No changes"
          git push

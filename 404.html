<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Heebo', sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .timer-text { font-size: 2rem; margin-bottom: 1rem; }
        #timer-val { font-size: 8rem; font-weight: 900; color: #2ecc71; }
    </style>
</head>
<body>
    <div class="timer-text">הדף לא נמצא!<br>חוזרים לחנות בעוד...</div>
    <div id="timer-val">3</div>
    <script>
        let count = 3;
        const timer = setInterval(() => {
            count--;
            if (count >= 0) document.getElementById('timer-val').innerText = count;
            if (count < 0) { clearInterval(timer); window.location.href = "/"; }
        }, 1000);
    </script>
</body>
</html>

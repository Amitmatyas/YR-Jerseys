<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעבר לאתר</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
        }
        .message-box {
            text-align: center;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            background: white;
        }
    </style>
</head>
<body>

    <div id="status" class="message-box">
        <h1>מיד תועבר לאתר...</h1>
        <p>טוען נתונים, אנא המתן.</p>
    </div>

    <script>
        const storageKey = 'has_visited_jerseysu';
        const targetUrl = 'https://jerseysu.x.yupoo.com';

        if (localStorage.getItem(storageKey)) {
            // אם כבר ביקר - חוסם ומציג הודעה
            document.getElementById('status').innerHTML = `
                <h1 style="color: red;">הגישה חסומה</h1>
                <p>כבר השתמשת בלינק החד-פעמי שלך.</p>
            `;
        } else {
            // אם פעם ראשונה - מסמן שביקר ומפנה
            localStorage.setItem(storageKey, 'true');
            
            // השהיה קלה של שנייה כדי שיספיק להירשם ב-Storage לפני המעבר
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 1000);
        }
    </script>
</body>
</html>
